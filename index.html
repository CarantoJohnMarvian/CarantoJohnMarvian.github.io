<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Portfolio</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #120000, #350000, #090909);
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        .profile {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 25px;
            animation: fadeIn 1.5s ease-out;
        }

        .picture-frame {
            width: 220px;
            height: 220px;
            border-radius: 50%;
            padding: 5px;
            background: linear-gradient(135deg, #ff4d4d, #990000, #ff9999);
            box-shadow: 0 0 25px rgba(255, 0, 0, 0.35);
            animation: float 4s ease-in-out infinite,
                       glow 3s ease-in-out infinite alternate;
            transition: transform 0.4s ease;
        }

        .picture-frame:hover {
            transform: scale(1.08);
        }

        .picture-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            display: block;
            border: 4px solid #1a0000;
        }

        h1 {
            color: white;
            font-size: clamp(28px, 5vw, 42px);
            font-weight: 700;
            text-align: center;
            letter-spacing: 2px;
            text-shadow: 0 0 15px rgba(255, 40, 40, 0.6);
            animation: slideUp 1.2s ease-out;
            transition: color 0.3s ease;
        }

        h1:hover {
            color: #ff6666;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-12px);
            }
        }

        @keyframes glow {
            from {
                box-shadow: 0 0 20px rgba(255, 0, 0, 0.3);
            }
            to {
                box-shadow: 0 0 40px rgba(255, 0, 0, 0.7);
            }
        }

        @media (max-width: 480px) {
            .picture-frame {
                width: 170px;
                height: 170px;
            }

            h1 {
                letter-spacing: 1px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation: none !important;
                transition: none !important;
            }
        }
    </style>
</head>
<body>

    <main class="profile">
        <div class="picture-frame">
            <img src="myphoto.jpg" alt="My Picture">
        </div>

        <h1>YOUR FULL NAME</h1>
    </main>

</body>
</html>
