<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caranto John Marvian P</title>
 
    <style>
        @property --angle {
            syntax: "<angle>";
            initial-value: 0deg;
            inherits: false;
        }
 
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
 
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 6vw;
            background: linear-gradient(120deg, #050507, #14082b, #07030f, #1d0b3d, #050507);
            background-size: 300% 300%;
            animation: bgShift 18s ease-in-out infinite;
            font-family: Arial, Helvetica, sans-serif;
            overflow-x: hidden;
            position: relative;
        }
 
        /* ---------- Animated background layers ---------- */
        .bg {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }
 
        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(90px);
            opacity: 0.55;
        }
 
        .orb.one {
            width: 460px;
            height: 460px;
            background: #7c3aed;
            top: -120px;
            left: -100px;
            animation: drift1 16s ease-in-out infinite alternate;
        }
 
        .orb.two {
            width: 380px;
            height: 380px;
            background: #c026d3;
            bottom: -120px;
            right: -80px;
            opacity: 0.4;
            animation: drift2 20s ease-in-out infinite alternate;
        }
 
        .orb.three {
            width: 300px;
            height: 300px;
            background: #4f46e5;
            top: 45%;
            left: 45%;
            opacity: 0.3;
            animation: drift3 24s ease-in-out infinite alternate;
        }
 
        .grid {
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(rgba(168, 85, 247, 0.09) 1px, transparent 1px),
                linear-gradient(90deg, rgba(168, 85, 247, 0.09) 1px, transparent 1px);
            background-size: 60px 60px;
            -webkit-mask-image: radial-gradient(circle at center, #000 25%, transparent 75%);
            mask-image: radial-gradient(circle at center, #000 25%, transparent 75%);
            animation: gridMove 12s linear infinite;
        }
 
        /* Mouse spotlight (desktop) */
        .spotlight {
            position: absolute;
            inset: 0;
            background: radial-gradient(
                circle 320px at var(--mx, 50%) var(--my, 50%),
                rgba(168, 85, 247, 0.22),
                transparent 70%
            );
            opacity: 0;
            transition: opacity 0.6s ease;
        }
 
        .spotlight.on {
            opacity: 1;
        }
 
        .particle {
            position: absolute;
            top: 0;
            border-radius: 50%;
            background: #d8b4fe;
            box-shadow: 0 0 10px 2px rgba(192, 132, 252, 0.8);
            opacity: 0;
            animation: rise linear infinite;
        }
 
        /* Shooting stars */
        .star {
            position: absolute;
            top: var(--t);
            right: var(--r);
            width: 140px;
            height: 2px;
            border-radius: 2px;
            background: linear-gradient(90deg, #ffffff, rgba(216, 180, 254, 0.5), transparent);
            filter: drop-shadow(0 0 6px #c084fc);
            opacity: 0;
            animation: shoot 8s ease-out infinite;
        }
 
        /* Click sparks */
        .spark {
            position: fixed;
            z-index: 5;
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #e9d5ff;
            box-shadow: 0 0 10px 3px rgba(168, 85, 247, 0.9);
            pointer-events: none;
            animation: burst 0.8s ease-out forwards;
        }
 
        /* ---------- Layout ---------- */
        .profile {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 1200px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 6vw;
        }
 
        /* ---------- Picture (left, big) ---------- */
        .photo-wrap {
            flex: 0 0 auto;
            width: min(46vw, 520px);
            animation: popIn 1.2s cubic-bezier(0.2, 0.8, 0.2, 1) backwards,
                       float 5s ease-in-out 1.2s infinite;
            perspective: 900px;
        }
 
        .picture-frame {
            position: relative;
            width: 100%;
            aspect-ratio: 3 / 4;
            border-radius: 32px;
            padding: 6px;
            background: #0a0612;
            transform-style: preserve-3d;
            transition: transform 0.15s ease-out;
        }
 
        .picture-frame::before {
            content: "";
            position: absolute;
            inset: -4px;
            border-radius: 36px;
            background: conic-gradient(
                from var(--angle),
                #a855f7, #5b21b6, #0a0612, #d8b4fe, #7c3aed, #a855f7
            );
            animation: spin 5s linear infinite;
            z-index: -1;
        }
 
        .picture-frame::after {
            content: "";
            position: absolute;
            inset: -4px;
            border-radius: 36px;
            background: conic-gradient(
                from var(--angle),
                #a855f7, #5b21b6, #0a0612, #d8b4fe, #7c3aed, #a855f7
            );
            filter: blur(28px);
            opacity: 0.65;
            animation: spin 5s linear infinite, pulse 3s ease-in-out infinite alternate;
            z-index: -2;
        }
 
        .picture-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: 50% 68%;
            border-radius: 27px;
            display: block;
            border: 4px solid #0a0612;
            animation: imgReveal 1.6s cubic-bezier(0.2, 0.8, 0.2, 1) 0.2s backwards;
        }
 
        /* Shine that sweeps across the photo now and then */
        .picture-frame .shine {
            position: absolute;
            inset: 6px;
            border-radius: 27px;
            overflow: hidden;
            pointer-events: none;
        }
 
        .picture-frame .shine::before {
            content: "";
            position: absolute;
            top: 0;
            left: -60%;
            width: 40%;
            height: 100%;
            background: linear-gradient(100deg, transparent, rgba(255, 255, 255, 0.22), transparent);
            transform: skewX(-18deg);
            animation: shineSweep 6s ease-in-out 2s infinite;
        }
 
        /* ---------- Name (right) ---------- */
        .name {
            flex: 1;
        }
 
        h1 {
            color: #ffffff;
            font-size: clamp(40px, 7vw, 92px);
            font-weight: 800;
            line-height: 1.05;
            letter-spacing: 1px;
            text-shadow: 0 0 25px rgba(168, 85, 247, 0.55);
        }
 
        h1 span.line {
            display: block;
            white-space: nowrap;
        }
 
        h1 .last {
            color: #c084fc;
        }
 
        /* Each letter is wrapped by the script below */
        .letter {
            display: inline-block;
            transition: transform 0.25s ease, text-shadow 0.25s ease;
            animation: letterIn 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) calc(0.4s + var(--i) * 0.05s) backwards;
            cursor: default;
        }
 
        .letter:hover {
            transform: translateY(-12px) scale(1.18);
            text-shadow: 0 0 30px rgba(216, 180, 254, 1);
        }
 
        .last .letter {
            animation:
                letterIn 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) calc(0.4s + var(--i) * 0.05s) backwards,
                colorWave 3s ease-in-out calc(1.8s + var(--i) * 0.12s) infinite;
        }
 
        .bar {
            width: 0;
            height: 5px;
            border-radius: 3px;
            margin-top: 28px;
            background: linear-gradient(90deg, #a855f7, #5b21b6, #a855f7);
            background-size: 200% 100%;
            box-shadow: 0 0 14px rgba(168, 85, 247, 0.8);
            animation: grow 1s ease-out 1.5s forwards,
                       barFlow 3s linear 2.5s infinite;
        }
 
        /* ---------- Keyframes ---------- */
        @keyframes bgShift {
            0%, 100% { background-position: 0% 50%; }
            50%      { background-position: 100% 50%; }
        }
 
        @keyframes drift1 { to { transform: translate(180px, 140px) scale(1.15); } }
        @keyframes drift2 { to { transform: translate(-200px, -120px) scale(1.2); } }
        @keyframes drift3 { to { transform: translate(-160px, 110px) scale(0.8); } }
 
        @keyframes gridMove {
            to { background-position: 60px 60px; }
        }
 
        @keyframes rise {
            0%   { transform: translateY(105vh); opacity: 0; }
            10%  { opacity: 0.9; }
            90%  { opacity: 0.9; }
            100% { transform: translateY(-10vh); opacity: 0; }
        }
 
        @keyframes shoot {
            0%   { transform: rotate(-35deg) translateX(0); opacity: 0; }
            2%   { opacity: 1; }
            14%  { transform: rotate(-35deg) translateX(-900px); opacity: 0; }
            100% { transform: rotate(-35deg) translateX(-900px); opacity: 0; }
        }
 
        @keyframes burst {
            from {
                transform: translate(-50%, -50%) scale(1);
                opacity: 1;
            }
            to {
                transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(0);
                opacity: 0;
            }
        }
 
        @keyframes popIn {
            from {
                opacity: 0;
                transform: scale(0.88) translateY(30px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }
 
        @keyframes imgReveal {
            from {
                clip-path: inset(100% 0 0 0);
                transform: scale(1.35);
                filter: blur(10px);
            }
            to {
                clip-path: inset(0 0 0 0);
                transform: scale(1);
                filter: blur(0);
            }
        }
 
        @keyframes shineSweep {
            0%   { left: -60%; }
            30%  { left: 130%; }
            100% { left: 130%; }
        }
 
        @keyframes letterIn {
            from {
                opacity: 0;
                transform: translateY(-60px) rotate(-12deg) scale(0.6);
            }
            to {
                opacity: 1;
                transform: translateY(0) rotate(0) scale(1);
            }
        }
 
        @keyframes colorWave {
            0%, 100% { color: #c084fc; }
            50%      { color: #ffffff; }
        }
 
        @keyframes grow {
            to { width: 90px; }
        }
 
        @keyframes barFlow {
            to { background-position: -200% 0; }
        }
 
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50%      { transform: translateY(-14px); }
        }
 
        @keyframes spin {
            to { --angle: 360deg; }
        }
 
        @keyframes pulse {
            from { opacity: 0.35; }
            to   { opacity: 0.8; }
        }
 
        /* ---------- Mobile ---------- */
        @media (max-width: 800px) {
            body {
                padding: 30px 6vw;
            }
 
            .profile {
                flex-direction: column;
                gap: 32px;
            }
 
            .photo-wrap {
                width: min(82vw, 420px);
            }
 
            h1 {
                font-size: clamp(30px, 9vw, 56px);
            }
 
            .name {
                text-align: center;
            }
 
            .bar {
                margin-left: auto;
                margin-right: auto;
            }
 
            .orb {
                filter: blur(70px);
            }
        }
 
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation: none !important;
                transition: none !important;
            }
 
            .bar {
                width: 90px;
            }
 
            .particle, .star, .spotlight {
                display: none;
            }
        }
    </style>
</head>
<body>
 
    <!-- Animated background -->
    <div class="bg" aria-hidden="true">
        <div class="orb one"></div>
        <div class="orb two"></div>
        <div class="orb three"></div>
        <div class="grid"></div>
        <div class="spotlight" id="spotlight"></div>
        <div class="star" style="--t: 8%;  --r: 10%; animation-delay: 1s;"></div>
        <div class="star" style="--t: 22%; --r: 35%; animation-delay: 4s;"></div>
        <div class="star" style="--t: 5%;  --r: 60%; animation-delay: 6.5s;"></div>
        <div class="particles" id="particles"></div>
    </div>
 
    <main class="profile">
        <div class="photo-wrap">
            <div class="picture-frame" id="frame">
                <img src="profile.jpg" alt="Caranto John Marvian P">
                <div class="shine"></div>
            </div>
        </div>
 
        <div class="name">
            <h1>
                <span class="line last">Caranto</span>
                <span class="line rest">John Marvian P</span>
            </h1>
            <div class="bar"></div>
        </div>
    </main>
 
    <script>
        // Split the name into letters so each one can animate
        (function () {
            var index = 0;
            document.querySelectorAll("h1 .line").forEach(function (line) {
                var text = line.textContent;
                line.textContent = "";
                line.setAttribute("aria-label", text);
 
                text.split("").forEach(function (ch) {
                    var s = document.createElement("span");
                    s.className = "letter";
                    s.setAttribute("aria-hidden", "true");
                    s.style.setProperty("--i", index++);
                    s.textContent = ch === " " ? "\u00A0" : ch;
                    line.appendChild(s);
                });
            });
        })();
 
        // Floating particles
        (function () {
            var box = document.getElementById("particles");
            var count = window.innerWidth < 800 ? 22 : 45;
 
            for (var i = 0; i < count; i++) {
                var p = document.createElement("span");
                var size = Math.random() * 4 + 2;
 
                p.className = "particle";
                p.style.left = Math.random() * 100 + "%";
                p.style.width = size + "px";
                p.style.height = size + "px";
                p.style.animationDuration = (Math.random() * 12 + 10) + "s";
                p.style.animationDelay = (Math.random() * -20) + "s";
                box.appendChild(p);
            }
        })();
 
        // Photo tilt + mouse spotlight (desktop only)
        (function () {
            var frame = document.getElementById("frame");
            var spot = document.getElementById("spotlight");
            var canHover = window.matchMedia("(hover: hover)").matches &&
                           !window.matchMedia("(prefers-reduced-motion: reduce)").matches;
 
            if (!canHover) return;
 
            document.addEventListener("mousemove", function (e) {
                var x = (e.clientX / window.innerWidth - 0.5) * 2;
                var y = (e.clientY / window.innerHeight - 0.5) * 2;
 
                frame.style.transform =
                    "rotateY(" + (x * 8) + "deg) rotateX(" + (-y * 8) + "deg)";
 
                spot.style.setProperty("--mx", e.clientX + "px");
                spot.style.setProperty("--my", e.clientY + "px");
                spot.classList.add("on");
            });
 
            document.addEventListener("mouseleave", function () {
                frame.style.transform = "rotateY(0deg) rotateX(0deg)";
                spot.classList.remove("on");
            });
        })();
 
        // Sparks burst out wherever you click or tap
        (function () {
            if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
 
            document.addEventListener("click", function (e) {
                for (var i = 0; i < 14; i++) {
                    var s = document.createElement("span");
                    var angle = (Math.PI * 2 * i) / 14 + Math.random() * 0.4;
                    var dist = Math.random() * 70 + 50;
 
                    s.className = "spark";
                    s.style.left = e.clientX + "px";
                    s.style.top = e.clientY + "px";
                    s.style.setProperty("--dx", Math.cos(angle) * dist + "px");
                    s.style.setProperty("--dy", Math.sin(angle) * dist + "px");
                    document.body.appendChild(s);
 
                    setTimeout(function (el) { el.remove(); }, 850, s);
                }
            });
        })();
    </script>
 
</body>
</html>
