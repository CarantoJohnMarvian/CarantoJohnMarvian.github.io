<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caranto John Marvian P</title>
 
    <style>
        @property --angle {
            syntax: "<angle>";
            initial-value: 0deg;
            inherits: false;
        }
 
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
 
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 6vw;
            background: linear-gradient(120deg, #050507, #14082b, #07030f, #1d0b3d, #050507);
            background-size: 300% 300%;
            animation: bgShift 18s ease-in-out infinite;
            font-family: Arial, Helvetica, sans-serif;
            overflow-x: hidden;
            position: relative;
        }
 
        /* ---------- Animated background layers ---------- */
        .bg {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }
 
        /* Soft glowing orbs drifting around */
        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(90px);
            opacity: 0.55;
        }
 
        .orb.one {
            width: 460px;
            height: 460px;
            background: #7c3aed;
            top: -120px;
            left: -100px;
            animation: drift1 16s ease-in-out infinite alternate;
        }
 
        .orb.two {
            width: 380px;
            height: 380px;
            background: #c026d3;
            bottom: -120px;
            right: -80px;
            opacity: 0.4;
            animation: drift2 20s ease-in-out infinite alternate;
        }
 
        .orb.three {
            width: 300px;
            height: 300px;
            background: #4f46e5;
            top: 45%;
            left: 45%;
            opacity: 0.3;
            animation: drift3 24s ease-in-out infinite alternate;
        }
 
        /* Subtle grid that fades toward the edges */
        .grid {
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(rgba(168, 85, 247, 0.09) 1px, transparent 1px),
                linear-gradient(90deg, rgba(168, 85, 247, 0.09) 1px, transparent 1px);
            background-size: 60px 60px;
            -webkit-mask-image: radial-gradient(circle at center, #000 25%, transparent 75%);
            mask-image: radial-gradient(circle at center, #000 25%, transparent 75%);
            animation: gridMove 12s linear infinite;
        }
 
        /* Floating particles (created by the script at the bottom) */
        .particle {
            position: absolute;
            top: 0;
            border-radius: 50%;
            background: #d8b4fe;
            box-shadow: 0 0 10px 2px rgba(192, 132, 252, 0.8);
            opacity: 0;
            animation: rise linear infinite;
        }
 
        /* ---------- Layout ---------- */
        .profile {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 1200px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 6vw;
            animation: fadeIn 1.5s ease-out;
        }
 
        /* ---------- Picture (left, big) ---------- */
        .photo-wrap {
            flex: 0 0 auto;
            width: min(46vw, 520px);
            animation: float 5s ease-in-out infinite;
            perspective: 900px;
        }
 
        .picture-frame {
            position: relative;
            width: 100%;
            aspect-ratio: 3 / 4;
            border-radius: 32px;
            padding: 6px;
            background: #0a0612;
            transform-style: preserve-3d;
            transition: transform 0.15s ease-out;
        }
 
        /* Spinning light border */
        .picture-frame::before {
            content: "";
            position: absolute;
            inset: -4px;
            border-radius: 36px;
            background: conic-gradient(
                from var(--angle),
                #a855f7, #5b21b6, #0a0612, #d8b4fe, #7c3aed, #a855f7
            );
            animation: spin 5s linear infinite;
            z-index: -1;
        }
 
        /* Blurred glow behind the frame */
        .picture-frame::after {
            content: "";
            position: absolute;
            inset: -4px;
            border-radius: 36px;
            background: conic-gradient(
                from var(--angle),
                #a855f7, #5b21b6, #0a0612, #d8b4fe, #7c3aed, #a855f7
            );
            filter: blur(28px);
            opacity: 0.65;
            animation: spin 5s linear infinite, pulse 3s ease-in-out infinite alternate;
            z-index: -2;
        }
 
        .picture-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: 50% 68%;
            border-radius: 27px;
            display: block;
            border: 4px solid #0a0612;
        }
 
        /* ---------- Name (right) ---------- */
        .name {
            flex: 1;
        }
 
        h1 {
            color: #ffffff;
            font-size: clamp(40px, 7vw, 92px);
            font-weight: 800;
            line-height: 1.05;
            letter-spacing: 1px;
            text-shadow: 0 0 25px rgba(168, 85, 247, 0.55);
        }
 
        h1 span {
            display: block;
            opacity: 0;
            animation: slideUp 1s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }
 
        h1 .last {
            background: linear-gradient(90deg, #c084fc, #ffffff, #8b5cf6, #c084fc);
            background-size: 250% 100%;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: none;
            animation: slideUp 1s cubic-bezier(0.2, 0.8, 0.2, 1) 0.2s forwards,
                       shimmer 4s linear 1.2s infinite;
        }
 
        h1 .rest {
            animation-delay: 0.5s;
        }
 
        .bar {
            width: 0;
            height: 5px;
            border-radius: 3px;
            margin-top: 28px;
            background: linear-gradient(90deg, #a855f7, #5b21b6);
            box-shadow: 0 0 14px rgba(168, 85, 247, 0.8);
            animation: grow 1s ease-out 1.1s forwards;
        }
 
        /* ---------- Keyframes ---------- */
        @keyframes bgShift {
            0%, 100% { background-position: 0% 50%; }
            50%      { background-position: 100% 50%; }
        }
 
        @keyframes drift1 {
            to { transform: translate(180px, 140px) scale(1.15); }
        }
 
        @keyframes drift2 {
            to { transform: translate(-200px, -120px) scale(1.2); }
        }
 
        @keyframes drift3 {
            to { transform: translate(-160px, 110px) scale(0.8); }
        }
 
        @keyframes gridMove {
            to { background-position: 60px 60px; }
        }
 
        @keyframes rise {
            0%   { transform: translateY(105vh); opacity: 0; }
            10%  { opacity: 0.9; }
            90%  { opacity: 0.9; }
            100% { transform: translateY(-10vh); opacity: 0; }
        }
 
        @keyframes fadeIn {
            from { opacity: 0; }
            to   { opacity: 1; }
        }
 
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(40px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
 
        @keyframes shimmer {
            to { background-position: -250% 0; }
        }
 
        @keyframes grow {
            to { width: 90px; }
        }
 
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50%      { transform: translateY(-14px); }
        }
 
        @keyframes spin {
            to { --angle: 360deg; }
        }
 
        @keyframes pulse {
            from { opacity: 0.35; }
            to   { opacity: 0.8; }
        }
 
        /* ---------- Mobile ---------- */
        @media (max-width: 800px) {
            body {
                padding: 30px 6vw;
            }
 
            .profile {
                flex-direction: column;
                gap: 32px;
            }
 
            .photo-wrap {
                width: min(82vw, 420px);
            }
 
            .name {
                text-align: center;
            }
 
            .bar {
                margin-left: auto;
                margin-right: auto;
            }
 
            .orb {
                filter: blur(70px);
            }
        }
 
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation: none !important;
                transition: none !important;
            }
 
            h1 span {
                opacity: 1;
            }
 
            .bar {
                width: 90px;
            }
 
            .particle {
                display: none;
            }
        }
    </style>
</head>
<body>
 
    <!-- Animated background -->
    <div class="bg" aria-hidden="true">
        <div class="orb one"></div>
        <div class="orb two"></div>
        <div class="orb three"></div>
        <div class="grid"></div>
        <div class="particles" id="particles"></div>
    </div>
 
    <main class="profile">
        <div class="photo-wrap">
            <div class="picture-frame" id="frame">
                <img src="myphoto.jpg" alt="Caranto John Marvian P">
            </div>
        </div>
 
        <div class="name">
            <h1>
                <span class="last">Caranto</span>
                <span class="rest">John Marvian P</span>
            </h1>
            <div class="bar"></div>
        </div>
    </main>
 
    <script>
        // Floating particles
        (function () {
            var box = document.getElementById("particles");
            var count = window.innerWidth < 800 ? 22 : 45;
 
            for (var i = 0; i < count; i++) {
                var p = document.createElement("span");
                var size = Math.random() * 4 + 2;
 
                p.className = "particle";
                p.style.left = Math.random() * 100 + "%";
                p.style.width = size + "px";
                p.style.height = size + "px";
                p.style.animationDuration = (Math.random() * 12 + 10) + "s";
                p.style.animationDelay = (Math.random() * -20) + "s";
                box.appendChild(p);
            }
        })();
 
        // Photo tilts slightly toward the mouse (desktop only)
        (function () {
            var frame = document.getElementById("frame");
            var canTilt = window.matchMedia("(hover: hover)").matches &&
                          !window.matchMedia("(prefers-reduced-motion: reduce)").matches;
 
            if (!canTilt) return;
 
            document.addEventListener("mousemove", function (e) {
                var x = (e.clientX / window.innerWidth - 0.5) * 2;
                var y = (e.clientY / window.innerHeight - 0.5) * 2;
                frame.style.transform =
                    "rotateY(" + (x * 8) + "deg) rotateX(" + (-y * 8) + "deg)";
            });
 
            document.addEventListener("mouseleave", function () {
                frame.style.transform = "rotateY(0deg) rotateX(0deg)";
            });
        })();
    </script>
 
</body>
</html>
