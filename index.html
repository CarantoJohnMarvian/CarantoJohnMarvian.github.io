<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>John Marvian Caranto | Portfolio</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      color: #fff;
      font-family: "Segoe UI", Arial, sans-serif;
      overflow: hidden;
    }

    .background {
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at 20% 30%, rgba(147, 51, 234, 0.35), transparent 40%),
        radial-gradient(circle at 80% 70%, rgba(88, 28, 135, 0.45), transparent 45%),
        #000;
      animation: moveBackground 12s ease-in-out infinite alternate;
      z-index: -1;
    }

    @keyframes moveBackground {
      0% {
        transform: scale(1) translate(0, 0);
      }
      100% {
        transform: scale(1.15) translate(-20px, 20px);
      }
    }

    .card {
      text-align: center;
      padding: 50px 30px;
      border-radius: 24px;
      background: rgba(20, 20, 20, 0.65);
      border: 1px solid rgba(168, 85, 247, 0.35);
      box-shadow: 0 0 35px rgba(147, 51, 234, 0.35);
      backdrop-filter: blur(10px);
      animation: fadeIn 1.2s ease-out;
      max-width: 420px;
      width: 90%;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(35px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .profile-picture {
      width: 170px;
      height: 170px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid #a855f7;
      box-shadow: 0 0 25px rgba(168, 85, 247, 0.7);
      animation: pulse 3s ease-in-out infinite;
      margin-bottom: 25px;
    }

    @keyframes pulse {
      0%, 100% {
        box-shadow: 0 0 20px rgba(168, 85, 247, 0.5);
        transform: scale(1);
      }
      50% {
        box-shadow: 0 0 40px rgba(168, 85, 247, 0.9);
        transform: scale(1.04);
      }
    }

    h1 {
      font-size: 2.4rem;
      margin-bottom: 10px;
      background: linear-gradient(90deg, #ffffff, #c084fc, #a855f7);
      background-size: 200%;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: shine 4s linear infinite;
    }

    @keyframes shine {
      to {
        background-position: 200%;
      }
    }

    .subtitle {
      color: #d8b4fe;
      font-size: 1rem;
      letter-spacing: 1px;
    }

    .future-sections {
      margin-top: 35px;
      display: none;
    }
  </style>
</head>
<body>

  <div class="background"></div>

  <main class="card">
    <img
      src="profile.jpg"
      alt="John Marvian Caranto"
      class="profile-picture"
    >

    <h1>John Marvian Caranto</h1>
    <p class="subtitle">Portfolio</p>
