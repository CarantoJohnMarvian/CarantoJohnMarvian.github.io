<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>John Marvian Caranto | Portfolio</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px;
      background: #050208;
      color: #fff;
      font-family: "Segoe UI", system-ui, Arial, sans-serif;
      overflow-x: hidden;
    }

    .background {
      position: fixed;
      inset: -20%;
      z-index: -2;
      background:
        radial-gradient(circle at 15% 25%, rgba(168, 85, 247, 0.38), transparent 42%),
        radial-gradient(circle at 85% 75%, rgba(109, 40, 217, 0.42), transparent 45%),
        #050208;
      animation: moveBackground 18s ease-in-out infinite alternate;
    }

    .grid {
      position: fixed;
      inset: 0;
      z-index: -1;
      background-image:
        linear-gradient(rgba(168, 85, 247, 0.07) 1px, transparent 1px),
        linear-gradient(90deg, rgba(168, 85, 247, 0.07) 1px, transparent 1px);
      background-size: 45px 45px;
      mask-image: radial-gradient(circle at center, black 25%, transparent 75%);
    }

    @keyframes moveBackground {
      0% {
        transform: translate3d(0, 0, 0) scale(1);
      }
      100% {
        transform: translate3d(-35px, 30px, 0) scale(1.12);
      }
    }

    .container {
      width: min(900px, 100%);
      display: flex;
      align-items: center;
      gap: 45px;
      padding: 45px;
      border-radius: 30px;
      background: rgba(18, 12, 28, 0.72);
      border: 1px solid rgba(168, 85, 247, 0.28);
      box-shadow:
        0 25px 70px rgba(0, 0, 0, 0.55),
        0 0 60px rgba(168, 85, 247, 0.16);
      backdrop-filter: blur(16px);
      animation: fadeIn 1s ease-out both;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(35px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .picture-frame {
      position: relative;
      flex-shrink: 0;
      width: 300px;
      height: 360px;
      border-radius: 28px;
      overflow: hidden;
      border: 2px solid rgba(168, 85, 247, 0.55);
      box-shadow:
        0 0 35px rgba(168, 85, 247, 0.35),
        0 20px 50px rgba(0, 0, 0, 0.5);
      animation: glow 4s ease-in-out infinite;
    }

    .picture-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.4s ease;
    }

    .picture-frame:hover img {
      transform: scale(1.06);
    }

    @keyframes glow {
      0%, 100% {
        box-shadow:
          0 0 25px rgba(168, 85, 247, 0.30),
          0 20px 50px rgba(0, 0, 0, 0.5);
      }
      50% {
        box-shadow:
          0 0 50px rgba(168, 85, 247, 0.55),
          0 20px 50px rgba(0, 0, 0, 0.5);
      }
    }

    .name {
      font-size: clamp(2.4rem, 7vw, 4rem);
      line-height: 1.1;
      background: linear-gradient(90deg, #ffffff, #c084fc, #a855f7, #ffffff);
      background-size: 250%;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: shine 6s linear infinite;
    }

    @keyframes shine {
      to {
        background-position: 250%;
      }
    }

    @media (max-width: 720px) {
      .container {
        flex-direction: column;
        text-align: center;
        padding: 35px 22px;
        gap: 30px;
      }

      .picture-frame {
        width: min(280px, 85vw);
        height: 340px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .background,
      .container,
      .picture-frame,
      .name {
        animation: none;
      }

      .picture-frame img {
        transition: none;
      }
    }
  </style>
</head>
<body>

  <div class="background"></div>
  <div class="grid"></div>

  <main class="container">
    <div class="picture-frame">
      <img
        src="profile.jpg"
        alt="John Marvian Caranto"
      >
    </div>

    <h1 class="name">John Marvian Caranto</h1>
  </main>

</body>
</html>
